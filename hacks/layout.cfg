# Canonical memory map for injected code/data (single source of truth).
#
# rotkit build layout (tools/rotkit/build/layout.py) generates build/memmap.{inc,h,ld} from the table below, so the
# same addresses reach every consumer with NO hardcoded hex in the hack files:
#   hack.asm     -> .include "build/memmap.inc"   (armips:  MEM_<NAME> equ ...)
#   hack.ld      -> INCLUDE  build/memmap.ld       (ld:      MEM_<NAME> = ... ;)
#   patch C code -> #include "memmap.h"            (C:       #define MEM_<NAME> ..., via -Ibuild/hack_include)
# EDIT ADDRESSES HERE ONLY.
#
# Each entry emits MEM_<NAME> (start) and MEM_<NAME>_END (end). The optional CSYM column
# names a C global: rows with one also emit PROVIDE(<CSYM> = MEM_<NAME>) in memmap.ld, so
# the C bodies access the address as a plain extern global (asm keeps using MEM_<NAME>).
# columns:  NAME          SPACE(rom|ram)  START        END          [CSYM]
# --------------------------------------------------------------------------------------
HOOK          rom  0x08ffcc00  0x08ffcdff   # asm hook handlers
# modcode region: the mod's compiled C (linker .text/.rodata land here). Runs to the 32 MiB
# ROM ceiling, past the end of the 16 MiB base image; hack.asm grows the output to that ceiling.
MODCODE       rom  0x08ffce00  0x09ffffff
# MODCODE_BSS is DISABLED for now because we don't know if there are any globally "safe" RAM
# addresses. Do that research when it is needed
# MODCODE_BSS   ram  0x0203f000  0x0203ffff   # linker .bss base for the modcode
# --------------------------------------------------------------------------------------
#
# Hack state bytes in game-unused RAM (the game never touches this span; no xrefs in the
# ROM). One byte each, smallest type that fits the value.

# mod_save: the current 0-indexed save-slot page, which slot addressing reads and
# save_slot_pages moves. Kept across menu frames.
# This is the same address used in the original SavSlotPages ROM hack by SuperSaiyajinStackZ.
SAVE_SLOT_PAGE       ram  0x03007740  0x03007740  g_SaveSlotPage

# ranger_hollow_pages: the current 0-indexed hollow page, kept across shop visits.
HOLLOW_PAGE          ram  0x03007741  0x03007741  g_RangerHollowPage

# loot_qol: state byte (tag | option bits, see the patch).
LOOT_QOL_STATE       ram  0x03007742  0x03007742  g_LootQolState

# mod_options: the options menu's page mode (stock / mod settings).
MOD_OPTIONS_STATE    ram  0x03007743  0x03007743  g_ModOptionsMode

# mod_options: the current mod-settings page index.
MOD_OPTIONS_PAGE     ram  0x03007744  0x03007744  g_ModOptionsPage

# demo_pages: the dummy patch's throwaway option bytes.
DEMO_PAGES_CHOICE    ram  0x03007745  0x03007745  g_DemoPagesChoice
DEMO_PAGES_TOGGLE_A  ram  0x03007746  0x03007746  g_DemoPagesToggleA
DEMO_PAGES_TOGGLE_B  ram  0x03007747  0x03007747  g_DemoPagesToggleB
