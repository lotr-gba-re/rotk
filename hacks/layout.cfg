# Canonical memory map for injected code/data (single source of truth).
#
# rotkit build layout (tools/rotkit/build/layout.py) generates build/memmap.{inc,h,ld} from the table below, so the
# same addresses reach every consumer with NO hardcoded hex in the hack files:
#   hack.asm     -> .include "build/memmap.inc"   (armips:  MEM_<NAME> equ ...)
#   hack.ld      -> INCLUDE  build/memmap.ld       (ld:      MEM_<NAME> = ... ;)
#   patch C code -> #include "memmap.h"            (C:       #define MEM_<NAME> ..., via -Ibuild/hack_include)
# EDIT ADDRESSES HERE ONLY.
#
# Each entry emits MEM_<NAME> (start) and MEM_<NAME>_END (end).
# columns:  NAME          SPACE(rom|ram)  START        END
# --------------------------------------------------------------------------------------
# Injected ROM regions start past the 16 MiB base image: its tail up to 0x08ffdd40 is the
# EWRAM statics image (EwramStaticsImage), live data that crt0 and sfx_init copy to RAM.
# hack.asm grows the output to the 32 MiB ceiling.
HOOK          rom  0x09000000  0x090001ff   # asm hook handlers
# modcode region: the mod's compiled C (linker .text/.rodata land here).
MODCODE       rom  0x09000200  0x09ffffff
# modcode RAM: the linker .bss, so patches keep state in plain C globals. A slice at the top of
# EWRAM, which the game normally uses for its heap but mod_ram frees up for us.
MODCODE_BSS   ram  0x0203fd00  0x0203ffff
