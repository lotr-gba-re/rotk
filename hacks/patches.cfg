# Default-enabled patches for the hack build (`make hack`).
# One patch name per line (= a hacks/patches/<name>/ dir); '#' comments.
# Add to this selection without editing the file:  make hack HACKS="@cfg foo"  (@cfg = this file).
# A from-scratch HACKS="..." must still list the required patches below, or the build errors.
# Disable an optional patch by commenting its line.

# The following patches are REQUIRED by every build (the modcode is always linked).
# Excluding one errors the build on purpose. See hack.c for more information.
mod_save
mod_scenes # required for mod_save
mod_startup # required for mod_save

# Strongly recommended, otherwise migration from SavSlotPages makes no sense
save_slot_pages

# Strongly recommended, enabling it after migration loses ranger hollow data
ranger_hollow_pages

menu_text
fast_fade
mod_options
loot_qol
chapter_select

# Examples and demos:
# demo_pages # demo: two dummy mod-options pages, validating multi-patch + multi-page settings
# demo_table_patch # demo: a data-table patch overwriting one accessory prefix
